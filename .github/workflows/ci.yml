name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testes Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: pip install -e ".[cli,autonomous]" pytest pytest-asyncio pytest-cov

      - name: Rodar smoke test (15/15)
        run: python smoke_test.py

      - name: Rodar suite completa de testes
        run: pytest tests/ -v --tb=short

  lint:
    name: Qualidade de código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar ruff
        run: pip install ruff
      - name: Verificar formatação e lint
        run: ruff check guimitestai/ --select E,F,I,W --ignore E501 --output-format=github
