[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guimitestai"
version = "0.1.0"
description = "🐺 Guimí Test AI — Plataforma unificada de testes, observabilidade e compliance para sistemas de IA"
readme = "README.md"
license = { text = "Business Source License 1.1" }
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
  { name = "Emerson Guilherme", email = "contato@guimitestai.com" }
]
keywords = [
  "ai", "llm", "testing", "observability", "compliance",
  "langfuse", "langsmith", "garak", "red-teaming", "lgpd", "eu-ai-act",
  "evaluation", "monitoring", "security", "gdpr", "ccpa", "privacy",
  "guara", "guimi", "brazil", "cerrado"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: Other/Proprietary License",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "httpx>=0.25.0",
  "pydantic>=2.0.0",
  "rich>=13.0.0",
  "typer>=0.9.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
langfuse = ["langfuse>=2.0.0"]
langsmith = ["langsmith>=0.1.0"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.20.0"]
garak = ["garak>=0.9.0"]
autonomous = [
  "httpx>=0.25.0",
  "pyyaml>=6.0.0",
  "jsonschema>=4.0.0",
]
cli = [
  "typer>=0.9.0",
  "rich>=13.0.0",
  "pyyaml>=6.0.0",
]
all = [
  "langfuse>=2.0.0",
  "langsmith>=0.1.0",
  "openai>=1.0.0",
  "anthropic>=0.20.0",
  "garak>=0.9.0",
  "pyyaml>=6.0.0",
  "jsonschema>=4.0.0",
]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.1.0",
  "mypy>=1.0.0",
  "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://guimitestai.com"
Repository = "https://github.com/EmersonGuilherme/guimitestai"
Documentation = "https://docs.guimitestai.com"
"Bug Tracker" = "https://github.com/EmersonGuilherme/guimitestai/issues"

[project.scripts]
guimi = "guimitestai.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["guimitestai"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=guimitestai --cov-report=term-missing --cov-report=xml"
